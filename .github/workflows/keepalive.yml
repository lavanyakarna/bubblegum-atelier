name: Keep the boutique awake

# Render's free tier puts the API to sleep after ~15 minutes without traffic,
# which is why the first visitor after a quiet spell waits 30-60 seconds.
#
# This workflow pings the API every few minutes so the server never gets the
# chance to nap. It costs nothing and needs no other service or account.
#
# Each run pings 5 times, one minute apart, so there is always coverage even if
# GitHub starts the job a little late.

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes
  workflow_dispatch:           # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake the boutique
        run: |
          URL="https://bubblegum-atelier.onrender.com/"
          echo "Keeping $URL warm..."
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "  ping $i/5 -> HTTP $CODE at $(date -u +%H:%M:%S)"
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
          echo "Done - the server stays awake."
